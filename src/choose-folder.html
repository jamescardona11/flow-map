<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flow Map</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root { --bg:#0b0d10; --panel:#12161b; --panel2:#181e25; --line:#252c35; --line2:#333d49; --fg:#eef1f4; --muted:#9aa5b1; --accent:#8cc4ee; --accent-ink:#06121c; --danger:#ef7a70; }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 -apple-system, "Helvetica Neue", sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px 0; background: var(--bg); color: var(--fg); }
  main { width: min(32rem, 90vw); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0; color: var(--muted); }
  form { display: flex; gap: 8px; margin-top: 8px; }
  button, input { font: inherit; font-size: 13px; color: var(--fg); border: 1px solid var(--line2); border-radius: 8px; padding: 0 12px; height: 32px; }
  button { background: var(--panel2); cursor: pointer; transition: background .12s, border-color .12s; }
  button:hover:not(:disabled) { background: #202833; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input { flex: 1; min-width: 0; background: var(--bg); }
  input::placeholder { color: var(--muted); }
  button[type=submit] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button[type=submit]:hover:not(:disabled) { background: #a8d6f5; border-color: transparent; }
  #choose-dialog { margin-top: 16px; }
  #open-error { color: var(--danger); min-height: 1.5rem; margin-top: 8px; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  ul { list-style: none; padding: 0; margin: 24px 0 0; }
  #recents { margin-top: 0; }
  li + li { margin-top: 8px; }
  .recent { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; min-height: 56px; height: auto; padding: 10px 14px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .recent:hover:not(:disabled) { background: var(--panel); }
  .recent em { font-style: normal; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .recent strong { font-weight: 600; color: var(--fg); }
  .recent span { color: var(--muted); font: 12px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>Open a map</h1>
  <p>Choose the folder of a Flow Map map.</p>
  <button id="choose-dialog" type="button">Choose folder…</button>
  <form id="choose-folder">
    <input id="typed-path" placeholder="/path/to/map-folder" autocomplete="off" aria-label="Folder path">
    <button type="submit">Open</button>
  </form>
  <p id="open-error" role="alert"><!--__FLOWMAP_NOTICE__--></p>
  <!--__FLOWMAP_RECENTS__-->
</main>
<script>
const post = (url, body) => fetch(url, {
  method: 'POST',
  headers: { 'X-Flowmap': '1', 'Content-Type': 'application/json' },
  body: JSON.stringify(body ?? {}),
});
const showError = (message) => { document.getElementById('open-error').textContent = message; };

async function openFolder(path) {
  try {
    const response = await post('__flowmap-app/open', { path });
    if (response.ok) location.assign('/');
    else {
      const { error } = await response.json().catch(() => ({}));
      showError(error ?? 'Could not open that folder.');
    }
  } catch (e) { showError('Could not reach the app.'); }
}

document.getElementById('choose-folder').addEventListener('submit', (event) => {
  event.preventDefault();
  openFolder(document.getElementById('typed-path').value.trim());
});

document.addEventListener('click', (event) => {
  const map = event.target.closest('[data-path]');
  if (map) openFolder(map.dataset.path);
});

document.getElementById('choose-dialog').addEventListener('click', async (event) => {
  const button = event.currentTarget;
  button.disabled = true;
  try {
    const response = await post('__flowmap-app/choose-folder');
    if (!response.ok) return showError('Could not open the folder dialog.');
    const { path } = await response.json();
    if (path) openFolder(path);
  } catch (e) { showError('Could not reach the app.'); }
  finally { button.disabled = false; }
});
</script>
</body>
</html>
